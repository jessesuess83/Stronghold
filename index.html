<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stronghold</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="board-zone" aria-label="Stronghold board area">
        <header class="board-header">
          <h1 class="game-title">Stronghold</h1>
          <span class="sr-only" id="turnTitle">White Turn</span>
          <span class="sr-only" id="turnChip">W</span>
          <span class="sr-only" id="winner">-</span>
          <span class="sr-only" id="castleReserve">6</span>
          <span class="sr-only" id="whiteWalls">40</span>
          <span class="sr-only" id="blackWalls">40</span>
        </header>
        <div class="game-shell" aria-label="Stronghold board">
          <canvas id="board" width="980" height="820"></canvas>

          <div class="player-hud white-hud" id="whiteHud" aria-label="White player data">
            <div class="hud-heading">
              <span>White</span>
            </div>
            <div class="hud-stats">
              <span>Castles <strong id="whiteScore">0</strong></span>
            </div>
          </div>

          <div class="player-hud black-hud" id="blackHud" aria-label="Black player data">
            <div class="hud-heading">
              <span>Black</span>
            </div>
            <div class="hud-stats">
              <span>Castles <strong id="blackScore">0</strong></span>
            </div>
          </div>

          <div class="board-actions" aria-label="Board controls">
            <button id="undoBtn" class="secondary" title="Undo last action">↶ Undo</button>
            <button id="resetBtn" class="secondary" title="New game">New Game</button>
          </div>

          <div class="sr-only" id="log" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div class="win-modal" id="winModal" hidden>
      <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
        <p class="eyebrow">Game Over</p>
        <h2 id="winTitle">White Wins</h2>
        <button id="winResetBtn" class="secondary" title="Close winner message">OK</button>
      </div>
    </div>


    <div class="confirm-modal" id="confirmResetModal" hidden>
      <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="confirmResetTitle">
        <p class="eyebrow">New Game</p>
        <h2 id="confirmResetTitle">Are you sure?</h2>
        <div class="confirm-actions">
          <button id="cancelResetBtn" class="secondary" title="Keep current game">Cancel</button>
          <button id="confirmResetBtn" class="secondary danger" title="Start a new game">New Game</button>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
